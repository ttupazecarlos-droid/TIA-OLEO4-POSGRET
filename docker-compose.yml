# ============================================================
# Prueba local: PostgreSQL + PHP/Apache en Docker
#   docker compose up --build
#   App:  http://localhost:8080
#   Admin: http://localhost:8080/admin.html
# ============================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tia_oleo4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez que se crea el volumen
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tia_oleo4"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "1"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: tia_oleo4
      DB_USER: postgres
      DB_PASS: postgres
      DB_SSLMODE: disable
      SESSION_DRIVER: db
      SESSION_NAME: tiaoleo_sess
      SESSION_SECURE: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
